r(--ink);border:1px solid #cbd6de;border-radius:7px;padding:11px 13px;min-height:46px}textarea{resize:vertical;min-height:170px}.toolbar select{width:135px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;font-size:.9375rem}th{color:var(--muted);font-size:.875rem;background:#f5f7f9;font-weight:550}th,td{padding:16px 15px;border-bottom:1px solid var(--line)}td.titlecell{min-width:220px;font-weight:600}td.nowrap{white-space:nowrap}.tablewrap .btn{font-size:.875rem;padding:6px 11px}.empty{text-align:center;padding:50px 15px;color:var(--muted)}.note{padding:15px 18px;background:var(--soft);color:var(--accent);font-size:.9375rem;border-radius:8px}.article{padding:34px}.article h1{font-size:1.85rem;margin:16px 0}.articlebody{white-space:pre-wrap;line-height:1.9;padding:28px 0;min-height:150px}.attachment{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 20px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}.answer{border-left:3px solid var(--accent);padding:20px 24px;margin:25px 0;background:var(--soft);border-radius:0 8px 8px 0}.answer p{margin-bottom:0;white-space:pre-wrap}.login{max-width:470px;margin:35px auto}.login .brand{margin-bottom:25px}.login .btn{width:100%}.login h1{font-size:1.8rem}.statusline{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.bottomnote{font-size:.8125rem;color:var(--muted);margin-top:30px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#162b36;color:white;padding:15px 25px;border-radius:10px;z-index:20;box-shadow:0 5px 25px #0003;max-width:90vw}.formerror{color:#ae2c2c;margin:8px 0;font-size:.9375rem}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:18px}.segmented{display:flex;gap:8px;flex-wrap:wrap}.segmented label{flex:1;border:1px solid var(--line);border-radius:7px;padding:10px 13px;cursor:pointer;white-space:nowrap}.segmented label:has(input:checked){background:var(--soft);border-color:var(--accent);color:var(--accent)}.segmented input{width:auto;min-height:0;margin-right:7px;accent-color:var(--accent)}fieldset{border:0;padding:0;margin:0 0 20px}fieldset legend{margin-bottom:9px}.inlinecheck{display:flex;align-items:center;gap:9px;font-size:.875rem}.inlinecheck input{width:auto;min-height:0;accent-color:var(--accent)}.numberbig{font-size:3.3rem;line-height:1.2;color:var(--accent);letter-spacing:-.06em}.outlinebox{padding:25px 0;border-bottom:1px solid var(--line)}.outlinebox:last-child{border:0}.reportpage{padding:44px;background:white;border:1px solid var(--line);margin-bottom:22px}.reportpage h2{font-size:1.7rem;margin:18px 0}.reportpage h3{margin-top:25px}.reportpage p{line-height:1.9}.reportheader{display:flex;justify-content:space-between;color:var(--accent);font-size:.875rem;padding-bottom:15px;border-bottom:1px solid var(--line)}

<noscript>화면 이동을 위해 JavaScript를 활성화해 주세요. 이 파일은 외부 서버에 연결하지 않는 HTML 시안입니다.</noscript>
<script>
'use strict';
/* 03. 샘플 데이터입니다. 실제 구현 때에는 Django view가 DB에서 조회해 템플릿에 전달합니다.
   로그인 역할 변경, 글 저장, 체험 구매는 화면 확인용이며 보안 기능이 아닙니다.
   개인정보를 서버나 localStorage에 보내거나 저장하지 않습니다. */
const S={project:'academy',role:'student',filter:'전체',query:'',selected:1,paid:false,birth:null,edit:null,
 posts:[{id:1,type:'공지',title:'9월 기획 발표 일정과 준비사항 안내',author:'운영 관리자',date:'2026.09.08',body:'기획 발표는 9월 11일 금요일 점심 후에 진행합니다.\n\n주제와 요구사항을 정리하고, 데이터 모델과 주요 웹페이지 시안을 함께 준비해 주세요.\n\n구현 기간은 9월 14일부터 9월 23일까지이며, 결과 발표는 9월 23일 점심 후입니다.\n\n※ 이 게시글은 학습지원 포털 화면을 보여주기 위한 가상 공지입니다.',file:null},
 {id:2,type:'자료',title:'Django 게시판 만들기 · 수업 복습 노트',author:'운영 관리자',date:'2026.09.09',body:'게시판을 만드는 과정을 모델, 뷰, 템플릿 순서로 복습합니다.\n\n1. 모델에서 게시글의 데이터 구조를 정의합니다.\n2. 뷰에서 필요한 게시글을 조회합니다.\n3. 템플릿에서 조회한 내용을 표시합니다.\n\n첨부한 텍스트 파일은 다운로드 화면 확인용 샘플입니다.',file:'django_복습노트.txt'},
 {id:3,type:'질문',title:'마이그레이션을 언제 실행해야 하나요?',author:'김하늘',date:'2026.09.10',body:'모델에 작성일 컬럼을 추가했습니다.\n이때 makemigrations와 migrate를 모두 실행해야 하는지 궁금합니다.',answer:'모델의 필드 구성을 변경했다면 makemigrations로 변경 이력을 만들고, migrate로 DB에 적용합니다.\n먼저 변경 내용을 확인한 뒤 순서대로 실행해 보세요.',file:null},
 {id:4,type:'질문',title:'파일 크기 제한은 어디서 확인하나요?',author:'이도윤',date:'2026.09.10',body:'업로드하는 파일을 2MB 이하로 제한하고 싶습니다. 서버에서도 검사해야 할까요?',file:null}],
 inquiries:[]};
const $=s=>document.querySelector(s);
// 사용자 입력을 HTML로 넣기 전에 특수문자를 치환해 태그로 실행되는 것을 방지합니다.
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// GitHub Pages에서도 별도 서버 없이 이동하도록 모든 주소를 AI 아카데미 해시 경로로 고정합니다.
const route=(p)=>`#academy/${p}`;
const link=(p,label,cls='btn')=>`<a class="${cls}" href="${route(p)}">${label}</a>`;
const badge=(t,neutral=false)=>`<span class="badge ${neutral?'neutral':''}">${esc(t)}</span>`;
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,3500)}
function go(page){const h=route(page);if(location.hash===h)render();else location.hash=h}
function heading(k,t,desc='',action=''){return `<div class="heading"><div><div class="eyebrow">${k}</div><h1>${t}</h1>${desc?`<p class="lead">${desc}</p>`:''}</div>${action}</div>`}
function shell(page){
 const academy=true;S.project='academy';document.body.classList.remove('saju');
 // 화면 메뉴는 회원·과정·개설강좌·수강신청·게시판 관련 핵심 기능만 보여줍니다.
 const menu=[['home','학습 홈'],['courses','교육과정'],['mine','내 수강 정보'],['board','게시판']];
 document.querySelectorAll('[data-project]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.project===S.project)));
 $('#sidebar').innerHTML=`<a class="brand" href="${route(academy?'home':'input')}"><span class="brandmark">${academy?'AI':'담'}</span>${academy?'AI ACADEMY':'사주담'}</a><div class="subbrand">학습지원 포털</div><nav aria-label="주요 메뉴">${menu.map(([p,t],i)=>`<a href="${route(p)}" class="${page===p||(p==='board'&&['post','write'].includes(page))||(p==='summary'&&page==='report')?'active':''}"><span class="navnumber">0${i+1}</span>${t}</a>`).join('')}</nav><div class="sidebottom"><strong>배움이 이어지는 공간</strong><p>자료를 찾고, 질문을 남기세요.</p><a href="${route('login')}">체험 로그인 화면</a></div>`;
 $('#topbar').innerHTML=`<span class="crumb">${academy?'나의 학습 공간':'나를 돌아보는 작은 기록'}</span><div class="account"><span class="avatar">${S.role==='admin'?'관':'하'}</span><span>${S.role==='admin'?'운영 관리자':'김하늘'} <span class="meta">체험 계정</span></span><button data-action="role">${S.role==='admin'?'수강생 역할로 보기':'관리자 역할로 보기'}</button><a href="${route('login')}" class="meta">로그인 화면</a></div>`;
}
function bottom(){return `<p class="bottomnote">기획 단계의 HTML 시안입니다. 버튼은 샘플 화면을 연결하며, 입력값은 현재 페이지에서만 유지됩니다.</p>`}
function courseCard(code,title,subtitle){return `<div class="panel"><div class="coursehead"><div class="coursecode">${code}</div><div>${badge('수강중')}<h3 style="margin-top:8px">${title}</h3><div class="meta">${subtitle}</div></div></div><div class="coursemeta"><div><p class="label">교육 기간</p><p class="value">2026.07.20 – 09.23</p></div><div><p class="label">수업 시간</p><p class="value">평일 09:00 – 18:00</p></div></div>${link('course','과정 자세히 보기','btn secondary')}</div>`}
function home(){return heading('MY LEARNING','하늘님, 오늘도 차근차근.','수강 정보와 필요한 학습자료를 확인해 보세요.')+`<div class="grid"><div class="stack"><section class="welcome"><div class="eyebrow">이번 주 학습 안내</div><h2>프로젝트의 첫 단계,<br>기획을 구체적인 화면으로.</h2><p>9월 11일 기획 발표를 준비하며<br>주제, 요구사항, 주요 화면을 정리해 보세요.</p>${link('post/1','기획 발표 안내 보기')}</section><section><div class="paneltitle"><h2>내 수강 과정</h2>${link('mine','전체 보기','link')}</div>${courseCard('DJ','Python & Django 웹개발','웹 서비스 개발 실무 · 1반')}</section></div><div class="stack"><section class="panel"><div class="paneltitle"><h2>최근 공지와 자료</h2>${link('board','더 보기','link')}</div>${S.posts.filter(p=>p.type!=='질문').map(p=>`<div class="listitem"><div>${badge(p.type,true)}<p><a href="${route('post/'+p.id)}">${esc(p.title)}</a></p><p class="meta">${p.date}</p></div></div>`).join('')}</section><section class="panel"><h2>궁금한 점이 있나요?</h2><p class="lead">수업 중 막힌 부분을 질문으로 남겨 주세요. 관리자의 답변을 확인할 수 있어요.</p>${link('write','질문 작성하기','btn secondary')}</section></div></div>`}
function courses(){return heading('COURSES','교육과정','교육 내용과 실제 개설반을 함께 확인하세요.')+`<div class="grid equal">${courseCard('DJ','Python & Django 웹개발','게시판과 데이터베이스로 만드는 웹 서비스')}<section class="panel"><div class="coursehead"><div class="coursecode">DB</div><div>${badge('개설예정',true)}<h3 style="margin-top:8px">데이터베이스 설계 기초</h3><div class="meta">관계형 데이터 모델과 SQL</div></div></div><p class="lead">개념 모델부터 SQL 작성까지, 데이터의 구조를 차근차근 익힙니다.</p><div class="coursemeta"><div><p class="label">교육 기간</p><p class="value">2026.10.05 – 10.30</p></div><div><p class="label">수준</p><p class="value">입문</p></div></div>${link('course-db','과정 자세히 보기','btn secondary')}</section></div>`}
function course(db=false){return heading('COURSE DETAIL',db?'데이터베이스 설계 기초':'Python & Django 웹개발',db?'관계형 데이터의 구조와 SQL을 익히는 과정':'파이썬 기초를 웹서비스 구현으로 연결하는 과정',link('courses','목록으로','btn secondary'))+`<div class="grid"><section class="panel"><h2>과정 소개</h2><p class="lead">${db?'업무 요구사항을 데이터 관계로 표현하고, SQL로 생성·입력·조회하는 방법을 배웁니다.':'모델, 뷰, 템플릿의 역할을 이해하고 게시판과 파일 첨부 기능이 있는 웹서비스를 만듭니다.'}</p><h2>주요 학습 내용</h2><ol class="checklist">${(db?['요구사항과 개념 모델','논리·물리 모델 및 제약조건','DDL·DML·DQL 작성','관계 조회와 데이터 검증']:['Python과 Django MTV','모델 관계와 ORM 조회','게시판과 파일 업로드','Git 변경 이력과 실행 안내']).map(t=>`<li>${t}</li>`).join('')}</ol></section><section class="panel"><h2>개설반 안내</h2>${badge(db?'개설예정':'진행중')}<h3 style="margin-top:18px">${db?'DB 설계 기초 1반':'Django 웹개발 1반'}</h3><div class="coursemeta"><div><p class="label">시작일</p><p class="value">${db?'2026.10.05':'2026.07.20'}</p></div><div><p class="label">종료일</p><p class="value">${db?'2026.10.30':'2026.09.23'}</p></div></div><p class="meta">수강등록은 관리자가 진행합니다.</p>${link('mine','내 수강 정보 확인','btn secondary')}</section></div>`}
function mine(){return heading('MY COURSES','내 수강 정보','본인 계정에 등록된 과정만 표시합니다.')+`<section class="panel"><div class="paneltitle"><h2>등록한 과정 <span class="badge">1</span></h2><span class="meta">김하늘 수강생</span></div><div class="tablewrap"><table><thead><tr><th>교육과정 / 개설반</th><th>교육 기간</th><th>수강 상태</th><th>상세</th></tr></thead><tbody><tr><td class="titlecell">Python & Django 웹개발<div class="meta">Django 웹개발 1반</div></td><td>2026.07.20 – 09.23</td><td>${badge('수강중')}</td><td>${link('course','보기','btn secondary')}</td></tr></tbody></table></div><p class="meta" style="margin-top:20px">등록 정보가 다르면 게시판에 문의해 주세요.</p></section>`}
function board(){let ps=S.posts.filter(p=>(S.filter==='전체'||p.type===S.filter)&&p.title.toLowerCase().includes(S.query.toLowerCase())).slice().reverse();return heading('COMMUNITY','공지 · 자료 · 질문','학습에 필요한 자료를 찾고 궁금한 점을 나눠 보세요.',link('write',S.role==='admin'?'게시글 작성':'질문 작성'))+`<section class="panel"><form id="search" class="toolbar"><label class="skip" for="category">분류</label><select id="category" name="category">${['전체','공지','자료','질문'].map(t=>`<option ${S.filter===t?'selected':''}>${t}</option>`).join('')}</select><label class="skip" for="query">제목 검색</label><input id="query" name="query" type="search" value="${esc(S.query)}" placeholder="제목으로 검색하세요"><button class="btn" type="submit">검색</button></form><div class="tablewrap"><table><thead><tr><th>분류</th><th>제목</th><th>작성자</th><th>등록일</th><th>답변</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${badge(p.type,p.type==='공지')}</td><td class="titlecell"><a class="link" href="${route('post/'+p.id)}">${esc(p.title)}</a>${p.file?' <span class="meta">첨부</span>':''}</td><td class="nowrap">${esc(p.author)}</td><td class="nowrap">${p.date}</td><td class="nowrap">${p.type==='질문'?badge(p.answer?'답변 완료':'답변 대기',!p.answer):'—'}</td></tr>`).join('')}</tbody></table></div>${!ps.length?'<div class="empty">검색 결과가 없습니다. 다른 검색어를 입력해 주세요.</div>':''}<div class="meta" style="margin-top:16px">총 ${ps.length}건</div></section>`}
function post(){const p=S.posts.find(x=>x.id===S.selected);if(!p)return heading('COMMUNITY','게시글을 찾을 수 없습니다.','삭제되었거나 존재하지 않는 글입니다.',link('board','목록으로'));let own=S.role==='admin'||p.author==='김하늘';return `<div class="heading">${link('board','게시판 목록','btn ghost')}<span class="meta">${p.type} 상세</span></div><article class="panel article">${badge(p.type)}<h1>${esc(p.title)}</h1><div class="meta">${esc(p.author)} &nbsp; ${p.date}</div><div class="articlebody">${esc(p.body)}</div>${p.file?`<div class="attachment"><div><strong>${esc(p.file)}</strong><div class="meta">화면 확인용 첨부파일</div></div><button class="btn secondary" data-action="download">샘플 다운로드</button></div>`:''}${p.type==='질문'?`<div class="answer"><h3>${p.answer?'관리자 답변':'답변을 기다리고 있어요'}</h3><p>${esc(p.answer||'관리자가 내용을 확인한 뒤 답변을 남깁니다.')}</p></div>${S.role==='admin'?`<form id="answer"><div class="field"><label for="answertext">관리자 답변</label><textarea id="answertext" name="answer" required>${esc(p.answer||'')}</textarea></div><button class="btn" type="submit">답변 저장</button></form>`:''}`:''}<div class="actions" style="margin-top:28px">${link('board','목록으로','btn secondary')}${own?'<button class="btn secondary" data-action="edit">수정</button><button class="btn danger" data-action="delete">삭제</button>':''}</div></article>`}
function write(){let p=S.edit?S.posts.find(p=>p.id===S.edit):null;return heading('WRITE',p?'게시글 수정':S.role==='admin'?'게시글 작성':'질문 작성','수업과 관련된 내용을 남겨 주세요.',link('board','취소','btn secondary'))+`<form class="panel" id="write"><div class="field"><label for="ptype">분류</label><select id="ptype" name="type">${(S.role==='admin'?['공지','자료','질문']:['질문']).map(t=>`<option ${p?.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="ptitle">제목</label><input id="ptitle" name="title" required maxlength="100" value="${esc(p?.title||'')}" placeholder="핵심 내용을 한 문장으로 적어 주세요"></div><div class="field"><label for="pbody">내용</label><textarea id="pbody" name="body" required placeholder="어떤 과정에서 어려움이 있었나요?">${esc(p?.body||'')}</textarea></div><div class="field"><label for="pfile">첨부파일 · 선택</label><input id="pfile" name="file" type="file" accept=".pdf,.txt,.png,.jpg,.jpeg"><small>2MB 이하, PDF·TXT·PNG·JPG. 시안에서는 이름만 표시하며 파일을 업로드하지 않습니다.</small>${p?.file?`<small>현재 첨부: ${esc(p.file)}</small><label class="inlinecheck"><input type="checkbox" name="removeFile"> 기존 첨부 제거</label>`:''}</div><p class="formerror" id="writeerror" role="alert"></p><div class="actions"><button class="btn" type="submit">${p?'수정 저장':'등록하기'}</button>${link('board','취소','btn secondary')}</div></form>`}
function login(){return `<section class="panel login"><div class="brand"><span class="brandmark">${S.project==='academy'?'AI':'담'}</span>${S.project==='academy'?'AI ACADEMY':'사주담'}</div><h1>반가워요.<br>나의 공간으로 들어오세요.</h1><p class="lead">실제 계정 정보 없이 화면을 체험해 보세요.</p><form id="login"><div class="field"><label for="demorole">체험 계정</label><select name="role" id="demorole"><option value="student">김하늘 · 사용자</option><option value="admin">운영 관리자</option></select></div><button class="btn" type="submit">체험 로그인</button></form><p class="meta" style="margin-top:22px">회원가입과 실제 인증은 연결하지 않은 기획 시안입니다.</p></section>`}
function birthLabel(){return S.birth?`${esc(S.birth.nickname)} · ${esc(S.birth.date)} · ${S.birth.calendar==='lunar'?'음력':'양력'}${S.birth.leap?' 윤달':''} · ${S.birth.unknown?'시간 모름':esc(S.birth.time)}`:'샘플 사용자 · 1995.05.20 · 양력 · 09:30'}
function inputPage(){return heading('A MOMENT FOR YOURSELF','나의 이야기를 시작해 볼까요?','출생 정보를 입력하고 보고서의 구성과 흐름을 살펴보세요.')+`<div class="grid"><form class="panel" id="birth"><h2>출생 정보</h2><div class="field"><label for="nickname">이름 또는 별명</label><input id="nickname" name="nickname" maxlength="20" required value="하늘" autocomplete="off"></div><div class="field"><label for="birthdate">생년월일</label><input id="birthdate" name="date" inputmode="numeric" required pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" placeholder="1995-05-20" value="1995-05-20"><small>YYYY-MM-DD 형식으로 입력하세요.</small></div><fieldset><legend>달력 구분</legend><div class="segmented"><label><input type="radio" name="calendar" value="solar" checked>양력</label><label><input type="radio" name="calendar" value="lunar">음력</label></div></fieldset><label class="inlinecheck" style="margin-bottom:20px"><input type="checkbox" name="leap" id="leap" disabled>음력 윤달에 태어났어요</label><div class="field"><label for="birthtime">태어난 시간</label><input id="birthtime" name="time" type="time" value="09:30"><label class="inlinecheck"><input type="checkbox" name="unknown" id="unknown">태어난 시간을 몰라요</label></div><p class="formerror" id="birtherror" role="alert"></p><button class="btn" type="submit">요약 화면 체험하기</button><p class="meta" style="margin-top:15px">실제 사주 계산 없이 같은 예시 보고서를 보여줍니다. 가상 정보로 체험해 주세요.</p></form><aside class="stack reportaside"><section class="readingintro"><div class="eyebrow">YOUR READING</div><h2 class="reporttitle">천천히 읽고,<br>나를 돌아보는 시간.</h2><p>짧은 요약으로 먼저 살펴보고,<br>더 궁금하다면 상세 보고서를 읽어 보세요.</p><div class="statusline"><span class="pagecount">02</span><span>페이지 구성의<br>상세 리포트</span></div></section><section class="panel"><h2>보고서에 담을 내용</h2><div class="outlinebox"><strong>01 성향과 나의 방식</strong><p class="meta">익숙한 행동을 돌아보는 질문</p></div><div class="outlinebox"><strong>02 관계와 생활 조언</strong><p class="meta">일상에서 생각해 볼 작은 실천</p></div><p class="meta">전통적 해석을 활용한 재미와 자기성찰 콘텐츠를 기획합니다. 미래를 확정적으로 예측하지 않습니다.</p></section></aside></div>`}
function summary(){return heading('YOUR SUMMARY','나를 돌아보는 첫 페이지',birthLabel())+`<div class="grid"><section class="panel article">${badge('디자인용 예시 · 실제 풀이 아님')}<h2 class="reporttitle" style="margin-top:24px">차분히 살펴보고,<br>나의 속도로 나아가기.</h2><p class="bodycopy">아래 문장은 보고서의 말투와 분량을 보여주기 위한 공통 예시입니다. 입력한 생년월일을 해석한 결과가 아닙니다.</p><div class="outlinebox"><h3>나의 선택 방식</h3><p class="bodycopy">결정을 앞두고 무엇을 먼저 확인하는지 떠올려 보세요. 충분한 정보가 필요한 순간과, 작은 시도를 먼저 해 볼 수 있는 순간을 구분해 보는 것도 좋습니다.</p></div><div class="outlinebox"><h3>이번에 생각해 볼 질문</h3><p class="bodycopy">지금 하고 싶은 일 가운데, 오늘 10분 안에 시작할 수 있는 것은 무엇인가요?</p></div></section><aside class="panel reportaside"><div class="eyebrow">FULL REPORT</div><h2>상세 리포트</h2><p class="lead">성향과 생활 조언을<br>2쪽 구성의 문서로 읽어 보세요.</p><ul class="checklist"><li>성향을 돌아보는 설명</li><li>관계와 소통을 위한 질문</li><li>나에게 맞는 작은 실천</li></ul><div class="note">체험용 상세 열람<br>실제 금액 청구는 없습니다.</div><div style="margin-top:22px">${S.paid?link('report','상세 보고서 열기'):'<button class="btn" data-action="buy">체험 구매하고 상세 보기</button>'}</div><p class="meta" style="margin-top:18px">시안에서는 모든 사용자가 같은 예시 내용을 봅니다.</p></aside></div>`}
function report(){if(!S.paid)return heading('FULL REPORT','상세 열람 전입니다.','요약 화면에서 체험 구매 후 보고서를 확인하세요.',link('summary','요약 화면으로'));return heading('FULL REPORT','나의 상세 리포트','디자인용 공통 예시 · 실제 사주 계산 결과가 아닙니다.','<button class="btn" data-action="print">인쇄 / PDF로 저장</button>')+`<div class="noprint note" style="margin-bottom:22px">브라우저 인쇄 창에서 ‘PDF로 저장’을 선택할 수 있습니다. 실제 서비스의 자동 PDF 다운로드는 추후 구현 대상입니다.</div><article class="reportpage"><div class="reportheader"><span>사주담 · PERSONAL READING</span><span>01 / 02</span></div><div class="eyebrow" style="margin-top:25px">디자인용 예시 보고서</div><h2>나의 성향과 선택을 돌아보기</h2><p class="meta">${birthLabel()}</p><div class="note">입력 정보는 표지에만 표시합니다. 아래 내용은 모든 사용자에게 같은 문장으로 제공하는 샘플이며, 계산된 사주풀이가 아닙니다.</div><h3>생각의 속도와 결정의 방식</h3><p>어떤 선택은 충분한 정보를 모은 뒤 내리는 편이 편안하고, 어떤 선택은 작게 시도해 본 뒤 조정할 수 있습니다. 최근의 결정을 떠올리며 내가 무엇을 기준으로 판단했는지 적어 보세요. 결과보다 그때의 생각을 살펴보는 데 의미를 두어도 좋습니다.</p><h3>집중하기 좋은 환경</h3><p>일을 시작하기 쉬웠던 장소와 시간대를 떠올려 보세요. 조용한 공간, 짧은 작업 시간, 분명한 마감처럼 나에게 도움이 되었던 조건을 찾아볼 수 있습니다. 모든 조건을 한 번에 바꾸기보다 하나만 조정해 보는 방법도 있습니다.</p><h3>나에게 남기는 질문</h3><p>최근에 만족스러웠던 선택은 무엇인가요?<br>그 선택에서 다음에도 지키고 싶은 기준은 무엇인가요?<br>오늘 시작할 수 있는 가장 작은 행동은 무엇인가요?</p><p class="meta">전통적 해석을 활용한 콘텐츠 서비스의 화면 예시입니다. 확정적인 예측이나 전문적 판단을 제공하지 않습니다.</p></article><article class="reportpage"><div class="reportheader"><span>사주담 · PERSONAL READING</span><span>02 / 02</span></div><h2>관계와 일상에 적용해 보기</h2><h3>내가 편안하게 소통하는 방법</h3><p>대화를 나눈 뒤 편안했던 순간을 떠올려 보세요. 충분히 설명할 시간이 있었는지, 상대의 이야기를 먼저 들었는지, 질문을 주고받았는지 살펴볼 수 있습니다. 나에게 필요한 소통 방식을 알아차리면 상대에게도 더 구체적으로 표현할 수 있습니다.</p><h3>작은 실천 한 가지</h3><p>이번 주에 바꾸고 싶은 일 한 가지를 골라 보세요. 막연한 목표 대신 언제, 어디서, 얼마나 해 볼지 적어 봅니다. 예를 들어 하루 10분 동안 배운 내용을 세 문장으로 정리하는 식입니다. 실행한 뒤에는 부담이 적절했는지 확인해 보세요.</p><h3>기록해 둘 내용</h3><p>내가 선택한 작은 실천: ________________________<br><br>시작할 시간과 장소: ___________________________<br><br>해 본 뒤 느낀 점: ______________________________</p><div class="note">이 보고서는 문서 구성과 인쇄 흐름을 확인하는 공통 샘플입니다. 서비스 구현 시 계산 도구와 해석 기준을 검증한 뒤 실제 콘텐츠를 연결합니다.</div></article><div class="actions noprint">${link('history','내 보고서','btn secondary')}${link('inquiry','보고서 문의하기','btn ghost')}</div>`}
function history(){return heading('MY REPORTS','내 보고서','내가 만든 기록을 다시 확인하세요.')+`<section class="panel"><div class="tablewrap"><table><thead><tr><th>보고서</th><th>생성일</th><th>열람 상태</th><th>보기</th></tr></thead><tbody><tr><td class="titlecell">${S.birth?esc(S.birth.nickname):'하늘'}님의 예시 리포트<div class="meta">공통 샘플 · 실제 풀이 아님</div></td><td>2026.09.10</td><td>${badge(S.paid?'상세 열람 가능':'무료 요약',!S.paid)}</td><td>${link(S.paid?'report':'summary','보고서 보기','btn secondary')}</td></tr></tbody></table></div></section>`}
function inquiry(){return heading('QUESTIONS','보고서 문의','화면과 보고서 이용에 관한 질문을 남겨 주세요.')+`<div class="grid"><form id="inquiry" class="panel"><h2>새 문의 작성</h2><div class="field"><label for="ititle">제목</label><input id="ititle" name="title" required maxlength="100" placeholder="어떤 점이 궁금하신가요?"></div><div class="field"><label for="ibody">문의 내용</label><textarea id="ibody" name="body" required placeholder="궁금한 내용을 적어 주세요"></textarea></div><p class="meta">민감한 개인정보는 적지 마세요. 입력한 문의는 새로고침하면 초기화됩니다.</p><button class="btn" type="submit">문의 등록</button></form><section class="panel"><h2>내 문의 내역</h2>${S.inquiries.length?S.inquiries.map((x,i)=>`<div class="outlinebox">${badge(x.answer?'답변 완료':'답변 대기',!x.answer)}<h3 style="margin-top:12px">${esc(x.title)}</h3><p style="white-space:pre-wrap">${esc(x.body)}</p>${x.answer?`<div class="answer"><strong>관리자 답변</strong><p>${esc(x.answer)}</p></div>`:S.role==='admin'?`<form class="inquiry-answer" data-index="${i}"><div class="field"><label for="ia${i}">답변</label><textarea id="ia${i}" name="answer" required></textarea></div><button class="btn secondary" type="submit">답변 저장</button></form>`:''}</div>`).join(''):'<div class="empty">아직 등록한 문의가 없습니다.</div>'}</section></div>`}
/* 04. 해시 주소로 화면을 바꿉니다. 한 HTML 파일에서도 뒤로가기와 메뉴 이동이 가능합니다.
   실제 구현 때에는 각 함수의 HTML을 templates/*.html로 나누고 URL을 Django urls.py에 연결합니다. */
function render(){
 S.project='academy';
 const parts=location.hash.slice(1).split('/');
 const page=parts[1]||'home';
 if(parts[2])S.selected=Number(parts[2]);
 shell(page);
 // Django 구현 단계에서는 아래 화면 함수를 templates 폴더의 HTML 파일로 분리합니다.
 const pages={home,courses,course:()=>course(),'course-db':()=>course(true),mine,board,post,write,login};
 $('#main').innerHTML=(pages[page]||pages.home)()+bottom();
 document.title='AI 아카데미 · '+({home:'학습 홈',courses:'교육과정',course:'과정 상세','course-db':'과정 상세',mine:'내 수강 정보',board:'게시판',post:'게시글 상세',write:'게시글 작성',login:'로그인'}[page]||'학습지원 포털');
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
// 버튼 동작은 한 곳에 모았습니다. DB 저장·다운로드 권한 검사는 나중에 서버에서도 구현해야 합니다.
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
 if(b.dataset.project){S.project=b.dataset.project;S.edit=null;go(S.project==='academy'?'home':'input');return}
 const a=b.dataset.action;if(!a)return;
 if(a==='role'){S.role=S.role==='admin'?'student':'admin';render();toast('화면 확인용 역할을 변경했습니다. 실제 인증은 아닙니다.');}
 if(a==='edit'){S.edit=S.selected;go('write')}
 if(a==='delete'){const p=S.posts.find(x=>x.id===S.selected);if(p&&(S.role==='admin'||p.author==='김하늘')&&confirm('이 샘플 게시글을 삭제할까요?')){S.posts=S.posts.filter(x=>x.id!==S.selected);go('board');toast('샘플 게시글을 삭제했습니다.')}}
 if(a==='buy'){S.paid=true;go('report');toast('체험 열람을 완료했습니다. 실제 결제는 없습니다.');}
 if(a==='print')window.print();
 if(a==='download'){const blob=new Blob(['Django 학습자료 샘플\n\n모델: 데이터 구조\n뷰: 요청 처리\n템플릿: 화면 표시\n\n이 파일은 HTML 기획 시안의 다운로드 확인용입니다.'],{type:'text/plain;charset=utf-8'});let u=URL.createObjectURL(blob),el=document.createElement('a');el.href=u;el.download='django_복습노트_샘플.txt';el.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('원본 첨부가 아닌 시연용 텍스트 샘플입니다.');}
});
document.addEventListener('click',ev=>{const a=ev.target.closest('a');if(a?.classList.contains('skip')){ev.preventDefault();$('#main').focus();return}if(a?.getAttribute('href')===route('write'))S.edit=null});
document.addEventListener('change',ev=>{if(ev.target.name==='calendar'){let lunar=ev.target.value==='lunar';$('#leap').disabled=!lunar;if(!lunar)$('#leap').checked=false}if(ev.target.id==='unknown')$('#birthtime').disabled=ev.target.checked;});
document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target,d=new FormData(f);
 if(f.id==='login'){S.role=d.get('role');go(S.project==='academy'?'home':'input');toast('체험 계정으로 화면을 열었습니다.');}
 if(f.id==='search'){S.filter=d.get('category');S.query=d.get('query').trim();render()}
 if(f.id==='write'){let title=d.get('title').trim(),body=d.get('body').trim(),file=d.get('file');if(!title||!body){$('#writeerror').textContent='제목과 내용을 입력해 주세요.';return}if(file?.size>2*1024*1024||file?.name&&!/\.(pdf|txt|png|jpe?g)$/i.test(file.name)){$('#writeerror').textContent='2MB 이하 PDF·TXT·PNG·JPG 파일을 선택해 주세요.';return}let p=S.posts.find(x=>x.id===S.edit);if(p){if(S.role!=='admin'&&p.author!=='김하늘')return;Object.assign(p,{title,body,type:d.get('type'),file:file?.name||(d.get('removeFile')?null:p.file)});}else{p={id:Math.max(...S.posts.map(x=>x.id),0)+1,type:S.role==='admin'?d.get('type'):'질문',title,body,author:S.role==='admin'?'운영 관리자':'김하늘',date:'2026.09.10',file:file?.name||null};S.posts.push(p)}S.edit=null;go('post/'+p.id);toast('현재 시안에만 저장했습니다. 새로고침하면 초기화됩니다.');}
 if(f.id==='answer'&&S.role==='admin'){let answer=d.get('answer').trim();if(!answer)return;S.posts.find(x=>x.id===S.selected).answer=answer;render();toast('샘플 답변을 저장했습니다.')}
 if(f.id==='birth'){const date=d.get('date'),calendar=d.get('calendar');let [y,m,day]=date.split('-').map(Number),dt=new Date(Date.UTC(y,m-1,day));let invalid=y<1900||y>2026||m<1||m>12||day<1||day>(calendar==='lunar'?30:31);if(calendar==='solar')invalid=invalid||dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m-1||dt.getUTCDate()!==day||date>'2026-09-10';if(invalid){$('#birtherror').textContent='날짜를 확인해 주세요. 시안은 1900~2026년 범위의 기본 입력만 확인합니다.';return}if(!d.get('unknown')&&!d.get('time')){$('#birtherror').textContent='시간을 입력하거나 시간 모름을 선택해 주세요.';return}S.birth={nickname:d.get('nickname').trim()||'사용자',date,calendar,leap:!!d.get('leap'),time:d.get('time'),unknown:!!d.get('unknown')};S.paid=false;go('summary');toast('계산 없이 공통 예시를 표시합니다. 음력·윤달의 실제 유효성은 미검증입니다.');}
 if(f.id==='inquiry'){const title=d.get('title').trim(),body=d.get('body').trim();if(!title||!body){toast('제목과 내용을 입력해 주세요.');return}S.inquiries.push({title,body});render();toast('샘플 문의를 등록했습니다.');}
 if(f.classList.contains('inquiry-answer')&&S.role==='admin'){let answer=d.get('answer').trim();if(answer){S.inquiries[Number(f.dataset.index)].answer=answer;render();toast('답변을 저장했습니다.')}}
});
render();
/* 기획 단계 범위: 주요 웹페이지 디자인(HTML)
   구현 단계에서는 Django와 SQLite를 연결하여 로그인, 수강조회, 게시판 데이터를 처리합니다. */
</script>
</body></html>
